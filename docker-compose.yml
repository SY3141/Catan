services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hexfish
      POSTGRES_USER: hexfish
      POSTGRES_PASSWORD: hexfish
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexfish -d hexfish"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  hexfish-catan-ui:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://hexfish:hexfish@postgres:5432/hexfish?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      HEXFISH_MULTIPLAYER_BACKEND: ${HEXFISH_MULTIPLAYER_BACKEND:-redis}
      HEXFISH_MULTIPLAYER_REQUIRED: ${HEXFISH_MULTIPLAYER_REQUIRED:-false}
    ports:
      - "3000:3000"
    volumes:
      - ./examples/catan/web:/app/examples/catan/web

volumes:
  postgres-data:
